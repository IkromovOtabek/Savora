# /etc/nginx/sites-available/savora.conf  →  ln -s ../sites-available/savora.conf /etc/nginx/sites-enabled/
# Savora — nginx reverse proxy (ikki ilova nusxasi: 3001, 3002). SSL — certbot (docs/DEPLOY.md 6-qadam).
#
# Rejim A (standart, NEXT_PUBLIC_USE_PATH_ROUTING=true): bitta domen — savora.uz, savora.uz/super, savora.uz/t/<slug>
# Rejim B (subdomen, NEXT_PUBLIC_USE_PATH_ROUTING=false): savora.uz, admin.savora.uz, <dokon>.savora.uz
#   → pastdagi server_name ga "*.savora.uz" qo'shing va wildcard sertifikat oling (DNS-01).

upstream savora_app {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3002 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

# Kirishlarni cheklash (brute-force/DoS'ga qarshi birinchi qatlam; ilovada ham rate-limit bor)
limit_req_zone $binary_remote_addr zone=savora_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=savora_api:10m rate=20r/s;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name savora.uz www.savora.uz;
    # Rejim B: server_name savora.uz www.savora.uz *.savora.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.savora.uz;
    ssl_certificate     /etc/letsencrypt/live/savora.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/savora.uz/privkey.pem;
    return 301 https://savora.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name savora.uz;
    # Rejim B: server_name savora.uz *.savora.uz;

    ssl_certificate     /etc/letsencrypt/live/savora.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/savora.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rasm yuklash limiti ilovada 5 MB; Excel import uchun zaxira bilan
    client_max_body_size 12m;

    access_log /var/log/nginx/savora.access.log;
    error_log  /var/log/nginx/savora.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Ilova birinchi IP ni oladi (lib/security.ts clientIpFrom) — mijoz yuborgan qiymatni QAYTA YOZAMIZ
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 3s;
    # Bitta nusxa qayta ishga tushayotganda so'rov ikkinchisiga o'tadi (uzilishsiz deploy)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Next.js statik fayllar — o'zgarmas (hash'li), uzoq kesh
    location /_next/static/ {
        proxy_pass http://savora_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Kirish / ro'yxatdan o'tish (server action POST) — qattiqroq limit
    location ~ ^/(login|register|forgot|super/login|t/[^/]+/login)$ {
        limit_req zone=savora_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://savora_app;
    }

    location /api/mobile/auth/ {
        limit_req zone=savora_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://savora_app;
    }

    # Cron — faqat serverning o'zidan (ilovada Bearer tekshiruvi ham bor)
    location /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://savora_app;
    }

    location /api/ {
        limit_req zone=savora_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://savora_app;
    }

    location / {
        proxy_pass http://savora_app;
    }
}
