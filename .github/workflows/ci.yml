name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Build/test uchun soxta qiymatlar (haqiqiy sirlar deploy serverda)
      SESSION_SECRET: ci-dummy-session-secret-32-characters-long
      MONGO_URI: mongodb://127.0.0.1:27017
      MASTER_DB_NAME: savora_ci
      NEXT_PUBLIC_USE_PATH_ROUTING: 'true'
      NEXT_PUBLIC_APP_URL: https://savora.uz
      NEXT_PUBLIC_ROOT_DOMAIN: savora.uz
      ROOT_DOMAIN: savora.uz
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  docker:
    # Dockerfile buzilmaganini tekshiradi (push qilinmaydi)
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t savora:ci --build-arg APP_VERSION=${GITHUB_SHA::7} web
