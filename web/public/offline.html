<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F4FA8" />
  <title>Internet yo'q — Savora</title>
  <style>
    :root {
      --bg: #f2f4f9; --card: #ffffff; --text: #0f1b33; --muted: #5d6880;
      --brand: #1f4fa8; --brand-hover: #2a5bb8; --gold: #f0bf4c; --line: rgba(15, 27, 51, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #05080f; --card: #0d1424; --text: #e8edf7; --muted: #8d97ad; --brand: #3567d6; --brand-hover: #4274e0; --line: rgba(255,255,255,.08); }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center; background: var(--card); border: 1px solid var(--line);
      border-radius: 20px; padding: 32px 24px 28px; box-shadow: 0 12px 40px rgba(31, 79, 168, .12);
    }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px; display: block; border-radius: 18px; box-shadow: 0 6px 18px rgba(31, 79, 168, .35); }
    h1 { font-size: 20px; line-height: 1.3; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
    button {
      width: 100%; min-height: 46px; background: var(--brand); color: #fff; border: 0; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s ease;
    }
    button:hover { background: var(--brand-hover); }
    button:focus-visible { outline: 3px solid rgba(31, 79, 168, .35); outline-offset: 2px; }
    .hint { margin: 16px 0 0; font-size: 13px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a68c4"/><stop offset="1" stop-color="#173f8f"/></linearGradient></defs>
      <rect width="100" height="100" rx="24" fill="url(#g)"/>
      <rect x="20" y="58" width="13" height="24" rx="6.5" fill="#fff" opacity=".55"/>
      <rect x="40" y="45" width="13" height="37" rx="6.5" fill="#fff" opacity=".8"/>
      <rect x="60" y="32" width="13" height="50" rx="6.5" fill="#fff"/>
      <path d="M24 46C38 28 58 20 79 21" fill="none" stroke="#f0bf4c" stroke-width="6.5" stroke-linecap="round"/>
      <circle cx="79" cy="21" r="6.5" fill="#f0bf4c"/>
    </svg>
    <h1>Internet aloqasi yo'q</h1>
    <p>Hozir tarmoqqa ulanib bo'lmadi. Ma'lumotlaringiz xavfsiz — aloqa tiklangach, sahifani qayta oching.</p>
    <button type="button" id="retry">Qayta urinish</button>
    <p class="hint"><span class="dot"></span>Aloqa tiklanganda sahifa o'zi yangilanadi</p>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
